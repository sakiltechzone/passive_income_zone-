<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>STZ Network - Movies & Viral Videos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .glass-nav {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .video-container {
            position: relative;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            width: 100%;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
        }
        .video-container iframe,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body class="pb-28">

    <!-- Header -->
    <header class="p-4 flex items-center justify-between border-b border-gray-800/60 sticky top-0 bg-[#0b0f19]/90 backdrop-blur z-40">
        <div class="flex items-center space-x-2">
            <span class="p-2 bg-rose-600/20 text-rose-500 rounded-xl">
                <i data-lucide="clapperboard" class="w-5 h-5"></i>
            </span>
            <span class="font-bold text-lg tracking-wide text-white">STZ Network</span>
        </div>
        <div class="flex items-center space-x-2 bg-gray-800/80 px-3 py-1.5 rounded-full border border-gray-700/50">
            <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
            <span id="userPoints" class="text-xs font-semibold text-gray-200">Free Stream</span>
        </div>
    </header>

    <!-- Categories Tab Bar -->
    <div class="px-4 pt-4">
        <div class="flex space-x-2 overflow-x-auto hide-scrollbar pb-2" id="categoryTabs">
            <button onclick="filterCategory('All')" class="category-btn active px-4 py-1.5 rounded-full text-xs font-medium bg-rose-600 text-white whitespace-nowrap shadow-lg shadow-rose-600/20">All</button>
            <button onclick="filterCategory('New Movie')" class="category-btn px-4 py-1.5 rounded-full text-xs font-medium bg-gray-800 text-gray-400 hover:text-white whitespace-nowrap">New Movie</button>
            <button onclick="filterCategory('Viral Video')" class="category-btn px-4 py-1.5 rounded-full text-xs font-medium bg-gray-800 text-gray-400 hover:text-white whitespace-nowrap">Viral Video</button>
            <button onclick="filterCategory('Facebook Viral')" class="category-btn px-4 py-1.5 rounded-full text-xs font-medium bg-gray-800 text-gray-400 hover:text-white whitespace-nowrap">Facebook</button>
            <button onclick="filterCategory('Instagram Viral')" class="category-btn px-4 py-1.5 rounded-full text-xs font-medium bg-gray-800 text-gray-400 hover:text-white whitespace-nowrap">Instagram</button>
            <button onclick="filterCategory('TikTok Viral')" class="category-btn px-4 py-1.5 rounded-full text-xs font-medium bg-gray-800 text-gray-400 hover:text-white whitespace-nowrap">TikTok</button>
        </div>
    </div>

    <!-- Video Feed Container -->
    <main class="px-4 mt-3 space-y-6" id="videoFeed">
        <!-- Loading State -->
        <div id="loadingIndicator" class="text-center py-16">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-rose-500 border-t-transparent"></div>
            <p class="text-xs text-gray-400 mt-2">ভিডিও লোড হচ্ছে...</p>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 glass-nav z-50 px-6 py-2.5">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <a href="dashboard.html" class="flex flex-col items-center text-rose-500 space-y-1">
                <i data-lucide="film" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Movies</span>
            </a>
            <a href="spin.html" class="flex flex-col items-center text-gray-400 hover:text-gray-200 space-y-1">
                <i data-lucide="loader-2" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Spin</span>
            </a>
            <a href="refer.html" class="flex flex-col items-center text-gray-400 hover:text-gray-200 space-y-1">
                <i data-lucide="users" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Refer</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-gray-200 space-y-1">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Profile</span>
            </a>
            <a href="withdraw.html" class="flex flex-col items-center text-gray-400 hover:text-gray-200 space-y-1">
                <i data-lucide="wallet" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Wallet</span>
            </a>
        </div>
    </nav>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // Lucide Icons Render
        lucide.createIcons();

        // Telegram Web App Setup
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Adsgram Block ID (আপনার নিজস্ব Adsgram Rewarded Block ID বসিয়ে নিন)
        const ADSGRAM_BLOCK_ID = "YOUR_ADSGRAM_BLOCK_ID";
        const AdController = window.Adsgram?.init({ blockId: ADSGRAM_BLOCK_ID });

        // Firebase Configuration (আপনার ফায়ারবেজ কনফিগ বসিয়ে নিন)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let allVideos = [];
        let activeCategory = 'All';

        // ফায়ারবেজ থেকে ভিডিও লোড করা
        db.ref('videos').on('value', (snapshot) => {
            const data = snapshot.val();
            const loadingIndicator = document.getElementById('loadingIndicator');
            if (loadingIndicator) loadingIndicator.style.display = 'none';

            if (data) {
                allVideos = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).reverse();
                renderVideos();
            } else {
                document.getElementById('videoFeed').innerHTML = `
                    <div class="text-center py-20 text-gray-500">
                        <i data-lucide="video-off" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
                        <p class="text-sm">এখনো কোনো ভিডিও আপলোড করা হয়নি।</p>
                    </div>
                `;
                lucide.createIcons();
            }
        });

        // ক্যাটাগরি ফিল্টারিং
        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.innerText.trim().toLowerCase() === cat.toLowerCase() || (cat === 'All' && btn.innerText.trim() === 'All')) {
                    btn.className = "category-btn px-4 py-1.5 rounded-full text-xs font-medium bg-rose-600 text-white whitespace-nowrap shadow-lg shadow-rose-600/20";
                } else {
                    btn.className = "category-btn px-4 py-1.5 rounded-full text-xs font-medium bg-gray-800 text-gray-400 hover:text-white whitespace-nowrap";
                }
            });
            renderVideos();
        }

        // ভিডিও ফিড রেন্ডার
        function renderVideos() {
            const feed = document.getElementById('videoFeed');
            feed.innerHTML = '';

            const filtered = activeCategory === 'All' 
                ? allVideos 
                : allVideos.filter(v => v.category === activeCategory);

            if (filtered.length === 0) {
                feed.innerHTML = `
                    <div class="text-center py-16 text-gray-500">
                        <p class="text-xs">এই ক্যাটাগরিতে কোনো ভিডিও পাওয়া যায়নি।</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(video => {
                const card = document.createElement('div');
                card.className = "bg-gray-900/70 border border-gray-800 rounded-2xl p-3 shadow-lg flex flex-col space-y-3";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-semibold tracking-wider uppercase px-2.5 py-0.5 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20">
                            ${video.category || 'Viral'}
                        </span>
                        <span class="text-[11px] text-gray-400 flex items-center gap-1">
                            <i data-lucide="eye" class="w-3.5 h-3.5"></i> Trending
                        </span>
                    </div>

                    <h3 class="text-sm font-semibold text-white leading-snug">${video.title || 'Untitled Video'}</h3>

                    <!-- প্লেয়ার কন্টেইনার -->
                    <div id="player-box-${video.id}" class="video-container">
                        ${
                            video.previewUrl
                            ? `<video src="${video.previewUrl}" controls playsinline preload="metadata" poster="${video.thumbnail || ''}"></video>`
                            : `<div class="absolute inset-0 flex items-center justify-center text-gray-500 text-xs">ফুল ভিডিও দেখতে নিচের বাটনে ক্লিক করুন</div>`
                        }
                    </div>

                    <!-- আনলক ও ওয়াচ ফুল ভিডিও বাটন -->
                    <div id="action-box-${video.id}">
                        <button onclick="handleUnlockMovie('${video.id}')" 
                                class="w-full py-2.5 px-4 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white rounded-xl font-medium text-xs flex items-center justify-center space-x-2 shadow-lg shadow-rose-600/25 transition active:scale-[0.98]">
                            <i data-lucide="play-circle" class="w-4 h-4"></i>
                            <span>Watch Full Video (Watch Ad)</span>
                        </button>
                    </div>
                `;

                feed.appendChild(card);
            });

            lucide.createIcons();
        }

        // Adsgram অ্যাড দেখিয়ে ফুল ভিডিও আনলক করার ফাংশন
        function handleUnlockMovie(videoId) {
            const video = allVideos.find(v => v.id === videoId);
            if (!video || !video.fullUrl) {
                alert('ভিডিও লিঙ্ক খুঁজে পাওয়া যায়নি!');
                return;
            }

            // Adsgram কল
            if (AdController) {
                AdController.show().then(() => {
                    // অ্যাড সফলভাবে দেখা শেষ হলে ভিডিও প্লে হবে
                    startFullStream(videoId, video.fullUrl);
                }).catch((err) => {
                    console.error("Adsgram Error:", err);
                    // টেস্ট মোড বা নেটওয়ার্ক ইররে ডিরেক্ট প্লে (প্রয়োজনে এটি বাদ দিয়ে শুধু অ্যালার্ট রাখতে পারেন)
                    startFullStream(videoId, video.fullUrl);
                });
            } else {
                // Adsgram লোড না থাকলে সরাসরি প্লে
                startFullStream(videoId, video.fullUrl);
            }
        }

        // Bunny Stream Web Player অথবা ডিরেক্ট লিঙ্ক প্লেয়ারে সেট করার মূল লজিক
        function startFullStream(videoId, streamUrl) {
            const playerBox = document.getElementById(`player-box-${videoId}`);
            const actionBox = document.getElementById(`action-box-${videoId}`);

            if (!playerBox) return;

            // যদি Bunny.net ওয়েব প্লেয়ার (mediadelivery.net), StreamWish বা Doodstream হয় -> Iframe ব্যবহার হবে
            const isWebPlayer = streamUrl.includes('mediadelivery.net') || 
                                streamUrl.includes('streamwish') || 
                                streamUrl.includes('dood') ||
                                !streamUrl.match(/\.(mp4|webm|mkv)$/i);

            if (isWebPlayer) {
                playerBox.innerHTML = `
                    <iframe 
                        src="${streamUrl}" 
                        loading="lazy" 
                        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen" 
                        allowfullscreen="true">
                    </iframe>
                `;
            } else {
                // সরাসরি .mp4 ফাইল হলে নেটিভ ভিডিও ট্যাগে প্লে হবে
                playerBox.innerHTML = `
                    <video src="${streamUrl}" controls autoplay playsinline></video>
                `;
            }

            // বাটন পরিবর্তন করে আনলকড স্ট্যাটাস দেখানো
            if (actionBox) {
                actionBox.innerHTML = `
                    <div class="py-2 text-center text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 rounded-xl text-xs flex items-center justify-center space-x-1.5 font-medium">
                        <i data-lucide="check-circle" class="w-4 h-4"></i>
                        <span>Now Playing Full Movie</span>
                    </div>
                `;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
