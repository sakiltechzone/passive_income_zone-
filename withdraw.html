<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STZ Network - Wallet & Withdraw</title>

    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #1c64f2;
            --light-blue: #3f83f8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --card-glass: rgba(255, 255, 255, 0.94);
            --card-white: #ffffff;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #3b82f6;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.25) 0%, transparent 60%),
                radial-gradient(rgba(255, 255, 255, 0.18) 1.5px, transparent 1.5px),
                linear-gradient(180deg, #1d6bf3 0%, #60a5fa 35%, #bfdbfe 70%, #f0f6ff 100%);
            background-size: 100% 100%, 16px 16px, 100% 100%;
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            /* টেলিগ্রাম টপ বার ও নচ এড়িয়ে চলার জন্য প্যাডিং */
            padding: calc(env(safe-area-inset-top, 0px) + 55px) 18px 110px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* Top Bar */
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .back-pill-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .brand-text {
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
        }

        /* Balance Hero Card */
        .balance-hero-card {
            width: 100%;
            background: var(--card-glass);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(15, 75, 216, 0.08);
            margin-bottom: 16px;
        }

        .balance-hero-card .caption {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-hero-card .usdt-val {
            font-size: 36px;
            font-weight: 800;
            color: var(--text-dark);
            margin: 4px 0 2px 0;
        }

        .balance-hero-card .coin-val {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-blue);
        }

        /* Withdraw Form Card */
        .form-card {
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: 0 8px 25px rgba(15, 75, 216, 0.06);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: #475569;
        }

        .styled-select, .styled-input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .styled-select:focus, .styled-input:focus {
            border-color: var(--primary-blue);
            background: #ffffff;
        }

        .input-with-max {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-max input {
            padding-right: 60px;
        }

        .btn-max {
            position: absolute;
            right: 8px;
            background: #e2edff;
            border: none;
            color: var(--primary-blue);
            font-size: 11px;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
        }

        .fee-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
        }

        .fee-val {
            color: #ef4444;
        }

        .receive-val {
            color: var(--success);
        }

        .hint-text {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        /* Submit Button */
        .btn-submit-withdraw {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            background: linear-gradient(135deg, #3b76f6, #1856f3);
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 8px 25px rgba(24, 86, 243, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
            transition: transform 0.1s;
        }

        .btn-submit-withdraw:active {
            transform: scale(0.98);
        }

        .btn-submit-withdraw:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* History Section */
        .history-section {
            width: 100%;
        }

        .history-section h4 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            margin-left: 4px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-height: 180px;
            overflow-y: auto;
        }

        .history-item {
            background: #ffffff;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .history-item .net-tag {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .history-item .time-sub {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .history-item .amt-col {
            text-align: right;
        }

        .history-item .amt-val {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .history-item .status-badge {
            font-size: 10px;
            font-weight: 700;
            color: #d97706;
            background: #fef3c7;
            padding: 2px 6px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 2px;
        }

        .history-item .status-badge.paid {
            color: #15803d;
            background: #dcfce7;
        }

        .history-item .status-badge.rejected {
            color: #b91c1c;
            background: #fee2e2;
        }

        .empty-history {
            text-align: center;
            padding: 18px;
            color: #94a3b8;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
        }

        /* 5-Button Modern Bottom Nav Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 68px;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            z-index: 99999 !important;
            padding: 0 4px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            height: 100%;
            text-decoration: none;
            -webkit-user-select: none;
        }

        .nav-item.active {
            color: var(--primary-blue);
        }

        .nav-item i {
            font-size: 17px;
            pointer-events: none;
        }

        .nav-item span {
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top App Bar -->
        <div class="top-nav">
            <a href="./index.html" class="back-pill-btn">
                <i class="fas fa-chevron-left"></i>
            </a>
            <span class="brand-text">Wallet & Payout</span>
            <div style="width: 36px;"></div>
        </div>

        <!-- Available Balance Display -->
        <div class="balance-hero-card">
            <span class="caption">Withdrawable Balance</span>
            <div class="usdt-val">$<span id="withdrawableUsdt">0.000</span> <span style="font-size: 18px;">USDT</span></div>
            <div class="coin-val"><span id="withdrawableCoins">0.00</span> STZ Assets</div>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <div class="form-group">
                <label>Payout Network</label>
                <select class="styled-select" id="withdrawNetwork" onchange="updatePlaceholder()">
                    <option value="Binance Pay ID">Binance Pay ID</option>
                    <option value="Ton Address">TON Wallet Address</option>
                </select>
            </div>

            <div class="form-group">
                <label id="addrLabel">Binance Pay ID</label>
                <input type="text" class="styled-input" id="withdrawAddress" placeholder="Your Binance Pay ID">
            </div>

            <div class="form-group">
                <label>Amount (USDT)</label>
                <div class="input-with-max">
                    <input type="number" step="0.01" class="styled-input" id="withdrawAmount" placeholder="Min: $1.00 USDT" oninput="calculatePreview()">
                    <button class="btn-max" onclick="setMaxAmount()">MAX</button>
                </div>
                
                <div class="fee-info-row">
                    <span id="feeNotice">Fee: $0.00 (Free)</span>
                    <span id="receiveNotice" class="receive-val">Receive: $0.000 USDT</span>
                </div>
                <span class="hint-text" id="amountPreview">Min withdrawal: $1.00 USDT</span>
            </div>

            <button class="btn-submit-withdraw" id="submitBtn" onclick="processWithdrawal()">
                <i class="fas fa-paper-plane"></i> Submit Request
            </button>
        </div>

        <!-- Withdrawal History Section -->
        <div class="history-section">
            <h4>Recent Requests</h4>
            <div class="history-list" id="withdrawHistoryContainer">
                <div class="empty-history">No withdrawal requests found.</div>
            </div>
        </div>
    </div>

    <!-- 5-Button Bottom Nav -->
    <nav class="bottom-nav">
        <a href="./index.html" class="nav-item">
            <i class="fas fa-magic"></i>
            <span>Prompts</span>
        </a>
        <a href="./dashboard.html" class="nav-item">
            <i class="fas fa-hammer"></i>
            <span>Mining</span>
        </a>
        <a href="./spin.html" class="nav-item">
            <i class="fas fa-dharmachakra"></i>
            <span>Spin</span>
        </a>
        <a href="./refer.html" class="nav-item">
            <i class="fas fa-user-friends"></i>
            <span>Referral</span>
        </a>
        <a href="./withdraw.html" class="nav-item active">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
    </nav>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        let tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.expand();
            }
        } catch(e) {}

        const STZ_TO_USDT = 0.001;
        let minWithdrawUsdt = 1.00;
        const TON_FEE_USDT = 0.001;

        const firebaseConfig = {
            apiKey: "AIzaSyAl0eRqOs5QNUg_J1Pj-4PlEqRDxAXr-oA",
            authDomain: "viral-zone-bd.firebaseapp.com",
            projectId: "viral-zone-bd",
            storageBucket: "viral-zone-bd.firebasestorage.app",
            messagingSenderId: "794737483555",
            appId: "1:794737483555:web:a275cd96aafff0e640f696",
            databaseURL: "https://viral-zone-bd-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userId = "sakil24";
        let userBalanceCoins = 0;

        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            userId = u.id ? u.id.toString() : (u.username || "sakil24");
        }

        updatePlaceholder();

        db.ref('system_settings').on('value', snap => {
            const val = snap.val();
            if (val && val.minWithdraw) {
                minWithdrawUsdt = parseFloat(val.minWithdraw);
                document.getElementById('amountPreview').innerText = `Min withdrawal: $${minWithdrawUsdt.toFixed(2)} USDT`;
                document.getElementById('withdrawAmount').placeholder = `Min: $${minWithdrawUsdt.toFixed(2)} USDT`;
            }
        });

        const userRef = db.ref('stz_miners/' + userId);
        userRef.on('value', snap => {
            const val = snap.val();
            if (val) {
                userBalanceCoins = val.balance || 0;
                const balanceInUsdt = userBalanceCoins * STZ_TO_USDT;
                document.getElementById('withdrawableCoins').innerText = userBalanceCoins.toFixed(2);
                document.getElementById('withdrawableUsdt').innerText = balanceInUsdt.toFixed(3);
            }
        });

        const historyRef = db.ref('withdraw_requests/' + userId);
        historyRef.on('value', snap => {
            const container = document.getElementById('withdrawHistoryContainer');
            const data = snap.val();

            if (!data) {
                container.innerHTML = `<div class="empty-history">No withdrawal requests found.</div>`;
                return;
            }

            let html = '';
            const list = Object.keys(data).map(k => data[k]).reverse();

            list.forEach(req => {
                const dateStr = new Date(req.timestamp).toLocaleDateString();
                const isPaid = req.status === "Approved" || req.status === "Paid";
                const isRejected = req.status === "Rejected";
                let statusClass = '';
                if (isPaid) statusClass = 'paid';
                else if (isRejected) statusClass = 'rejected';

                html += `
                    <div class="history-item">
                        <div>
                            <div class="net-tag">${req.network}</div>
                            <div class="time-sub">${dateStr}</div>
                        </div>
                        <div class="amt-col">
                            <div class="amt-val">-$${req.finalUsdt.toFixed(3)} USDT</div>
                            <span class="status-badge ${statusClass}">${req.status}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        });

        function updatePlaceholder() {
            const net = document.getElementById('withdrawNetwork').value;
            const input = document.getElementById('withdrawAddress');
            const label = document.getElementById('addrLabel');

            if (net === "Ton Address") {
                label.innerText = "TON Wallet Address";
                input.placeholder = "Your TON address (EQ...)";
            } else {
                label.innerText = "Binance Pay ID";
                input.placeholder = "Your Binance Pay ID";
            }
            calculatePreview();
        }

        function calculatePreview() {
            const net = document.getElementById('withdrawNetwork').value;
            const amtUsdt = parseFloat(document.getElementById('withdrawAmount').value) || 0;

            let fee = 0;
            if (net === "Ton Address") {
                fee = TON_FEE_USDT;
                document.getElementById('feeNotice').innerText = `Fee: $${fee} USDT`;
            } else {
                fee = 0;
                document.getElementById('feeNotice').innerText = `Fee: $0.00 (Free)`;
            }

            const finalUsdt = Math.max(0, amtUsdt - fee);
            document.getElementById('receiveNotice').innerText = `Receive: $${finalUsdt.toFixed(3)} USDT`;
        }

        function setMaxAmount() {
            const maxUsdt = userBalanceCoins * STZ_TO_USDT;
            document.getElementById('withdrawAmount').value = maxUsdt.toFixed(2);
            calculatePreview();
        }

        function processWithdrawal() {
            const network = document.getElementById('withdrawNetwork').value;
            const address = document.getElementById('withdrawAddress').value.trim();
            const amountUsdt = parseFloat(document.getElementById('withdrawAmount').value);
            const userTotalUsdt = userBalanceCoins * STZ_TO_USDT;

            if (!address) {
                showModalAlert(network === "Ton Address" ? "অনুগ্রহ করে আপনার TON ওয়ালেট অ্যাড্রেস দিন!" : "অনুগ্রহ করে আপনার Binance Pay ID দিন!");
                return;
            }

            if (isNaN(amountUsdt) || amountUsdt < minWithdrawUsdt) {
                showModalAlert(`ন্যূনতম উইথড্রয়াল $${minWithdrawUsdt.toFixed(2)} USDT!`);
                return;
            }

            if (amountUsdt > userTotalUsdt) {
                showModalAlert("আপনার একাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            const fee = (network === "Ton Address") ? TON_FEE_USDT : 0;
            const finalUsdt = amountUsdt - fee;
            const coinsToDeduct = amountUsdt / STZ_TO_USDT;
            const updatedBalanceCoins = userBalanceCoins - coinsToDeduct;

            const requestKey = historyRef.push().key;
            const requestPayload = {
                id: requestKey,
                userId: userId,
                network: network,
                address: address,
                amountStz: coinsToDeduct,
                amountUsdt: amountUsdt,
                feeUsdt: fee,
                finalUsdt: finalUsdt,
                status: "Pending",
                timestamp: Date.now()
            };

            const updates = {};
            updates['/withdraw_requests/' + userId + '/' + requestKey] = requestPayload;
            updates['/admin_withdraw_queue/' + requestKey] = requestPayload;
            updates['/stz_miners/' + userId + '/balance'] = updatedBalanceCoins;

            db.ref().update(updates).then(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Request';
                document.getElementById('withdrawAddress').value = "";
                document.getElementById('withdrawAmount').value = "";
                calculatePreview();

                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                showModalAlert(`✅ উইথড্রয়াল রিকোয়েস্ট সফলভাবে জমা হয়েছে!\nনেটওয়ার্ক: ${network}\nপ্রাপ্য: $${finalUsdt.toFixed(3)} USDT\nস্ট্যাটাস: Pending`);
            }).catch(err => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Request';
                showModalAlert("ত্রুটি ঘটেছে: " + err.message);
            });
        }

        function showModalAlert(msg) {
            if (tg && tg.showAlert) {
                tg.showAlert(msg);
            } else {
                alert(msg);
            }
        }
    </script>
</body>
</html>
