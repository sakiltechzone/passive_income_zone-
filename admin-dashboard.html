<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STZ Network - Admin Dashboard</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #1c64f2;
            --primary-glow: rgba(28, 100, 242, 0.25);
            --bg-dark: #090d16;
            --card-bg: #111827;
            --border: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(28, 100, 242, 0.12) 0%, transparent 50%),
                linear-gradient(180deg, #090d16 0%, #030712 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .admin-wrapper {
            width: 100%;
            max-width: 960px;
            padding: 20px 16px 80px 16px;
        }

        /* Top Bar */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .admin-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .admin-header h2 {
            font-size: 18px;
            font-weight: 800;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Navigation Tabs */
        .tab-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        /* Section Container */
        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .section-card h3 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Forms */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .styled-input, .styled-select, .styled-textarea {
            background: #030712;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .styled-input:focus, .styled-select:focus, .styled-textarea:focus {
            border-color: var(--primary);
        }

        .styled-textarea {
            resize: vertical;
            min-height: 90px;
        }

        .btn-action {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-cancel-edit {
            background: #1f2937;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
        }

        /* Prompts Feed */
        .prompt-item {
            background: #030712;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .prompt-info h4 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .prompt-info p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-family: monospace;
        }

        .badge-cat {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(28, 100, 242, 0.18);
            color: #60a5fa;
            text-transform: uppercase;
        }

        .prompt-actions {
            display: flex;
            gap: 6px;
        }

        .btn-edit {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid #3b82f6;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
        }

        .btn-approve {
            background: var(--success);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-right: 4px;
        }

        .btn-reject {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <!-- Header -->
        <div class="admin-header">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-sliders"></i></div>
                <div>
                    <h2>STZ Control Hub</h2>
                    <span style="font-size: 11px; color: var(--text-muted);" id="currentAdminEmail">admin@domain.com</span>
                </div>
            </div>
            <button class="btn-logout" onclick="handleLogout()"><i class="fas fa-arrow-right-from-bracket"></i> Sign Out</button>
        </div>

        <!-- Navigation Tabs -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchSection('promptsTab', this)"><i class="fas fa-magic"></i> AI Prompts</button>
            <button class="tab-btn" onclick="switchSection('settingsTab', this)"><i class="fas fa-gear"></i> System Config</button>
            <button class="tab-btn" onclick="switchSection('withdrawTab', this)"><i class="fas fa-wallet"></i> Payout Queue</button>
        </div>

        <!-- 1. AI Prompts Manager Tab -->
        <div id="promptsTab" class="content-tab">
            <div class="section-card">
                <h3 id="promptFormTitle"><i class="fas fa-plus-circle" style="color: var(--primary);"></i> Publish Viral AI Prompt</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Category / Platform</label>
                        <select id="promptCategory" class="styled-select">
                            <option value="facebook">Facebook Viral</option>
                            <option value="instagram">Instagram Reels</option>
                            <option value="tiktok">TikTok Trend</option>
                            <option value="dola_ai">Dola AI</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Prompt Title</label>
                        <input type="text" id="promptTitle" class="styled-input" placeholder="e.g. 3D Cartoon Old Man Emotion">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Preview Media Link (MP4 Video or Image URL)</label>
                        <input type="url" id="promptMediaUrl" class="styled-input" placeholder="https://example.com/preview.mp4">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Prompt Content (Copied by User after Ad)</label>
                        <textarea id="promptText" class="styled-textarea" placeholder="Paste the exact prompt text here..."></textarea>
                    </div>
                </div>
                <button class="btn-action" id="btnUploadPrompt" onclick="uploadPrompt()"><i class="fas fa-cloud-arrow-up"></i> <span id="btnUploadText">Publish to Feed</span></button>
                <button class="btn-cancel-edit" id="btnCancelEdit" onclick="cancelEditPrompt()"><i class="fas fa-xmark"></i> Cancel Edit</button>
            </div>

            <div class="section-card">
                <h3><i class="fas fa-list"></i> Active Prompts Library</h3>
                <div id="promptsListContainer">
                    <p style="color: var(--text-muted); font-size: 13px;">Loading published prompts...</p>
                </div>
            </div>
        </div>

        <!-- 2. System Settings Tab -->
        <div id="settingsTab" class="content-tab" style="display: none;">
            <div class="section-card">
                <h3><i class="fas fa-coins" style="color: var(--warning);"></i> System Economy Variables</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Referral Bonus (USDT per user)</label>
                        <input type="number" step="0.01" id="configReferBonus" class="styled-input" placeholder="0.10">
                    </div>
                    <div class="form-group">
                        <label>Minimum Withdrawal (USDT)</label>
                        <input type="number" step="0.1" id="configMinWithdraw" class="styled-input" placeholder="1.00">
                    </div>
                    <div class="form-group">
                        <label>Daily Spin Limit (Times)</label>
                        <input type="number" id="configSpinLimit" class="styled-input" placeholder="5">
                    </div>
                    <div class="form-group">
                        <label>Spin Pool Amounts (Comma separated USDT)</label>
                        <input type="text" id="configSpinPool" class="styled-input" placeholder="0.001, 0.0002, 0.002, 0.0005, 0.005, 0.001">
                    </div>
                </div>
                <button class="btn-action" onclick="saveSystemSettings()"><i class="fas fa-floppy-disk"></i> Update Global Variables</button>
            </div>
        </div>

        <!-- 3. Withdraw Queue Tab -->
        <div id="withdrawTab" class="content-tab" style="display: none;">
            <div class="section-card">
                <h3><i class="fas fa-clock-rotate-left" style="color: var(--warning);"></i> Pending Payout Requests</h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Method</th>
                                <th>Address / Pay ID</th>
                                <th>Payable (USDT)</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="withdrawTableBody">
                            <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No pending requests found.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase App, Auth & Database SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAl0eRqOs5QNUg_J1Pj-4PlEqRDxAXr-oA",
            authDomain: "viral-zone-bd.firebaseapp.com",
            projectId: "viral-zone-bd",
            storageBucket: "viral-zone-bd.firebasestorage.app",
            messagingSenderId: "794737483555",
            appId: "1:794737483555:web:a275cd96aafff0e640f696",
            databaseURL: "https://viral-zone-bd-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let editingPromptKey = null;
        let cachedPromptsData = {};

        // রিয়েল-টাইম অথেন্টিকেশন গার্ড
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "admin-login.html";
            } else {
                document.getElementById('currentAdminEmail').innerText = user.email;
                loadDashboardData();
            }
        });

        function handleLogout() {
            auth.signOut().then(() => {
                window.location.href = "admin-login.html";
            });
        }

        function switchSection(tabId, btn) {
            document.querySelectorAll('.content-tab').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            btn.classList.add('active');
        }

        function loadDashboardData() {
            // ১. সেটিংস লোড
            db.ref('system_settings').on('value', snap => {
                const conf = snap.val() || {};
                document.getElementById('configReferBonus').value = conf.referBonus || 0.10;
                document.getElementById('configMinWithdraw').value = conf.minWithdraw || 1.00;
                document.getElementById('configSpinLimit').value = conf.spinLimit || 5;
                document.getElementById('configSpinPool').value = conf.spinPool || "0.001, 0.0002, 0.002, 0.0005, 0.005, 0.001";
            });

            // ২. প্রম্পট লাইব্রেরি লোড
            db.ref('ai_prompts').on('value', snap => {
                const container = document.getElementById('promptsListContainer');
                const data = snap.val();
                if (!data) {
                    container.innerHTML = '<p style="color: var(--text-muted); font-size: 13px;">No prompts uploaded yet.</p>';
                    cachedPromptsData = {};
                    return;
                }

                cachedPromptsData = data;
                let html = '';
                Object.keys(data).reverse().forEach(key => {
                    const item = data[key];
                    html += `
                        <div class="prompt-item">
                            <div class="prompt-info">
                                <span class="badge-cat">${item.category}</span>
                                <h4>${item.title}</h4>
                                <p>${(item.promptText || '').substring(0, 100)}...</p>
                                ${item.mediaUrl ? `<a href="${item.mediaUrl}" target="_blank" style="color: #60a5fa; font-size: 11px;">View Media</a>` : ''}
                            </div>
                            <div class="prompt-actions">
                                <button class="btn-edit" onclick="editPrompt('${key}')"><i class="fas fa-pen-to-square"></i></button>
                                <button class="btn-delete" onclick="deletePrompt('${key}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });

            // ৩. উইথড্র পেন্ডিং কিউ লোড
            db.ref('admin_withdraw_queue').on('value', snap => {
                const tbody = document.getElementById('withdrawTableBody');
                const data = snap.val();
                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No pending requests.</td></tr>';
                    return;
                }

                let html = '';
                Object.keys(data).forEach(key => {
                    const req = data[key];
                    if (req.status === "Pending") {
                        html += `
                            <tr>
                                <td><b>${req.userId}</b></td>
                                <td>${req.network}</td>
                                <td style="font-family: monospace;">${req.address}</td>
                                <td style="color: var(--success); font-weight: 700;">$${req.finalUsdt.toFixed(3)}</td>
                                <td>
                                    <button class="btn-approve" onclick="handleWithdrawStatus('${key}', '${req.userId}', 'Paid')">Approve</button>
                                    <button class="btn-reject" onclick="handleWithdrawStatus('${key}', '${req.userId}', 'Rejected', ${req.amountStz})">Reject</button>
                                </td>
                            </tr>
                        `;
                    }
                });
                tbody.innerHTML = html || '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No pending requests.</td></tr>';
            });
        }

        // সেটিংস সেভ
        function saveSystemSettings() {
            const settings = {
                referBonus: parseFloat(document.getElementById('configReferBonus').value) || 0.10,
                minWithdraw: parseFloat(document.getElementById('configMinWithdraw').value) || 1.00,
                spinLimit: parseInt(document.getElementById('configSpinLimit').value) || 5,
                spinPool: document.getElementById('configSpinPool').value.trim()
            };

            db.ref('system_settings').update(settings).then(() => {
                alert("সিস্টেম সেটিংস সফলভাবে আপডেট হয়েছে!");
            });
        }

        // প্রম্পট এডিট মোড চালু করা
        function editPrompt(key) {
            const item = cachedPromptsData[key];
            if (!item) return;

            editingPromptKey = key;
            document.getElementById('promptCategory').value = item.category || 'facebook';
            document.getElementById('promptTitle').value = item.title || '';
            document.getElementById('promptMediaUrl').value = item.mediaUrl || '';
            document.getElementById('promptText').value = item.promptText || '';

            document.getElementById('promptFormTitle').innerHTML = '<i class="fas fa-pen-to-square" style="color: var(--warning);"></i> Edit Viral AI Prompt';
            document.getElementById('btnUploadText').innerText = 'Update Prompt';
            document.getElementById('btnCancelEdit').style.display = 'inline-flex';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // প্রম্পট এডিট বাতিল করা
        function cancelEditPrompt() {
            editingPromptKey = null;
            document.getElementById('promptTitle').value = "";
            document.getElementById('promptMediaUrl').value = "";
            document.getElementById('promptText').value = "";

            document.getElementById('promptFormTitle').innerHTML = '<i class="fas fa-plus-circle" style="color: var(--primary);"></i> Publish Viral AI Prompt';
            document.getElementById('btnUploadText').innerText = 'Publish to Feed';
            document.getElementById('btnCancelEdit').style.display = 'none';
        }

        // প্রম্পট পাবলিশ ও আপডেট হ্যান্ডলার
        function uploadPrompt() {
            const cat = document.getElementById('promptCategory').value;
            const title = document.getElementById('promptTitle').value.trim();
            const media = document.getElementById('promptMediaUrl').value.trim();
            const prompt = document.getElementById('promptText').value.trim();

            if (!title || !prompt) {
                alert("শিরোনাম এবং প্রম্পট টেক্সট দেওয়া আবশ্যক!");
                return;
            }

            if (editingPromptKey) {
                // বিদ্যমান প্রম্পট আপডেট
                db.ref('ai_prompts/' + editingPromptKey).update({
                    category: cat,
                    title: title,
                    mediaUrl: media || "",
                    promptText: prompt,
                    updatedAt: Date.now()
                }).then(() => {
                    cancelEditPrompt();
                    alert("প্রম্পট সফলভাবে আপডেট করা হয়েছে!");
                });
            } else {
                // নতুন প্রম্পট তৈরি
                const newPromptKey = db.ref('ai_prompts').push().key;
                db.ref('ai_prompts/' + newPromptKey).set({
                    id: newPromptKey,
                    category: cat,
                    title: title,
                    mediaUrl: media || "",
                    promptText: prompt,
                    createdAt: Date.now()
                }).then(() => {
                    cancelEditPrompt();
                    alert("প্রম্পট সফলভাবে লাইভ করা হয়েছে!");
                });
            }
        }

        // প্রম্পট ডিলিট
        function deletePrompt(key) {
            if (confirm("আপনি কি নিশ্চিত এই প্রম্পটটি ডিলিট করতে চান?")) {
                db.ref('ai_prompts/' + key).remove().then(() => {
                    if (editingPromptKey === key) {
                        cancelEditPrompt();
                    }
                });
            }
        }

        // উইথড্র অনুমোদন / বাতিল
        function handleWithdrawStatus(reqKey, uId, newStatus, refundCoins) {
            const updates = {};
            updates['/admin_withdraw_queue/' + reqKey + '/status'] = newStatus;
            updates['/withdraw_requests/' + uId + '/' + reqKey + '/status'] = newStatus;

            // রিজেক্ট হলে কয়েন রিফান্ড
            if (newStatus === "Rejected" && refundCoins) {
                db.ref('stz_miners/' + uId + '/balance').transaction(current => (current || 0) + refundCoins);
            }

            db.ref().update(updates).then(() => {
                alert(`রিকোয়েস্টটি ${newStatus} হয়েছে!`);
            });
        }
    </script>
</body>
</html>
