<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STZ Network - Withdraw Assets</title>

    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #1c64f2;
            --light-blue: #3f83f8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --card-glass: rgba(255, 255, 255, 0.94);
            --card-white: #ffffff;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #3b82f6;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.25) 0%, transparent 60%),
                radial-gradient(rgba(255, 255, 255, 0.18) 1.5px, transparent 1.5px),
                linear-gradient(180deg, #1d6bf3 0%, #60a5fa 35%, #bfdbfe 70%, #f0f6ff 100%);
            background-size: 100% 100%, 16px 16px, 100% 100%;
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 16px 18px 95px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Bar */
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .back-pill-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            backdrop-filter: blur(8px);
            font-size: 14px;
        }

        .brand-text {
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
        }

        /* Balance Card */
        .balance-hero-card {
            width: 100%;
            background: var(--card-glass);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(15, 75, 216, 0.08);
            margin-bottom: 16px;
        }

        .balance-hero-card .caption {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-hero-card .coin-val {
            font-size: 34px;
            font-weight: 800;
            color: var(--text-dark);
            margin: 4px 0 2px 0;
        }

        .balance-hero-card .coin-val .coin-name {
            font-size: 18px;
            color: var(--primary-blue);
        }

        .balance-hero-card .usdt-val {
            font-size: 14px;
            font-weight: 700;
            color: var(--success);
        }

        /* Withdraw Form */
        .form-card {
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: 0 8px 25px rgba(15, 75, 216, 0.06);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: #475569;
        }

        .styled-select, .styled-input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .styled-select:focus, .styled-input:focus {
            border-color: var(--primary-blue);
            background: #ffffff;
        }

        .input-with-max {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-max input {
            padding-right: 60px;
        }

        .btn-max {
            position: absolute;
            right: 8px;
            background: #e2edff;
            border: none;
            color: var(--primary-blue);
            font-size: 11px;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
        }

        .fee-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            margin-top: 2px;
        }

        .fee-val {
            color: #ef4444;
        }

        .receive-val {
            color: var(--success);
        }

        .hint-text {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Submit Action Button */
        .btn-submit-withdraw {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            background: linear-gradient(135deg, #3b76f6, #1856f3);
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 8px 25px rgba(24, 86, 243, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
            transition: transform 0.1s;
        }

        .btn-submit-withdraw:active {
            transform: scale(0.98);
        }

        .btn-submit-withdraw:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* History Section */
        .history-section {
            width: 100%;
        }

        .history-section h4 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            margin-left: 4px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-height: 180px;
            overflow-y: auto;
        }

        .history-item {
            background: #ffffff;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .history-item .net-tag {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .history-item .time-sub {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .history-item .amt-col {
            text-align: right;
        }

        .history-item .amt-val {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .history-item .status-badge {
            font-size: 10px;
            font-weight: 700;
            color: #d97706;
            background: #fef3c7;
            padding: 2px 6px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 2px;
        }

        .history-item .status-badge.paid {
            color: #15803d;
            background: #dcfce7;
        }

        .empty-history {
            text-align: center;
            padding: 18px;
            color: #94a3b8;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
        }

        /* Bottom Floating Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
        }

        .nav-item.active {
            color: var(--primary-blue);
        }

        .nav-item i {
            font-size: 18px;
        }

        .center-mine-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b76f6, #1856f3);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -24px;
            box-shadow: 0 6px 18px rgba(24, 86, 243, 0.4);
            text-decoration: none;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation -->
        <div class="top-nav">
            <a href="profile.html" class="back-pill-btn">
                <i class="fas fa-chevron-left"></i>
            </a>
            <span class="brand-text">Withdraw</span>
            <div style="width: 36px;"></div>
        </div>

        <!-- Available Balance Display -->
        <div class="balance-hero-card">
            <span class="caption">Withdrawable Balance</span>
            <div class="coin-val"><span id="withdrawableCoins">0.00</span> <span class="coin-name">STZ</span></div>
            <div class="usdt-val">≈ $<span id="withdrawableUsdt">0.00</span> USDT</div>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <div class="form-group">
                <label>Payout Network</label>
                <select class="styled-select" id="withdrawNetwork" onchange="updatePlaceholder()">
                    <option value="Ton Address">Ton Address</option>
                    <option value="Binance Pay ID">Binance Pay ID</option>
                </select>
            </div>

            <div class="form-group">
                <label id="addrLabel">Ton Wallet Address</label>
                <input type="text" class="styled-input" id="withdrawAddress" placeholder="Your ton address">
            </div>

            <div class="form-group">
                <label>Amount (STZ)</label>
                <div class="input-with-max">
                    <input type="number" class="styled-input" id="withdrawAmount" placeholder="Min: 100 STZ" oninput="calculatePreview()">
                    <button class="btn-max" onclick="setMaxAmount()">MAX</button>
                </div>
                
                <div class="fee-info-row">
                    <span id="feeNotice">Fee: $0.001 USDT</span>
                    <span id="receiveNotice" class="receive-val">Receive: $0.000 USDT</span>
                </div>
                <span class="hint-text" id="amountPreview">Min withdrawal: 100 STZ ($0.10 USDT)</span>
            </div>

            <button class="btn-submit-withdraw" id="submitBtn" onclick="processWithdrawal()">
                <i class="fas fa-paper-plane"></i> Submit Request
            </button>
        </div>

        <!-- Withdrawal History Section -->
        <div class="history-section">
            <h4>Recent Requests</h4>
            <div class="history-list" id="withdrawHistoryContainer">
                <div class="empty-history">No withdrawal requests found.</div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="dashboard.html" class="center-mine-btn">
            <i class="fas fa-hammer"></i>
        </a>
        <a href="refer.html" class="nav-item">
            <i class="fas fa-user-friends"></i>
            <span>Referral</span>
        </a>
    </nav>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ----------------- কনফিগারেশন -----------------
        const STZ_TO_USDT = 0.001; // ১ STZ = $০.০০১ USDT (১০০ STZ = $০.১০ USDT)
        const MIN_WITHDRAW_STZ = 100; // মিনিমাম ১০০ STZ ($০.১০)
        const TON_FEE_USDT = 0.001; // টন অ্যাড্রেসে ফি $০.০০১ USDT

        const firebaseConfig = {
            apiKey: "AIzaSyAl0eRqOs5QNUg_J1Pj-4PlEqRDxAXr-oA",
            authDomain: "viral-zone-bd.firebaseapp.com",
            projectId: "viral-zone-bd",
            storageBucket: "viral-zone-bd.firebasestorage.app",
            messagingSenderId: "794737483555",
            appId: "1:794737483555:web:a275cd96aafff0e640f696",
            databaseURL: "https://viral-zone-bd-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userId = "sakil24";
        let userBalance = 0;

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            userId = u.username ? u.username : u.id.toString();
        }

        updatePlaceholder();

        // ফায়ারবেজ থেকে ব্যালেন্স আনা
        const userRef = db.ref('stz_miners/' + userId);
        userRef.on('value', snap => {
            const val = snap.val();
            if (val) {
                userBalance = val.balance || 0;
                document.getElementById('withdrawableCoins').innerText = userBalance.toFixed(2);
                document.getElementById('withdrawableUsdt').innerText = (userBalance * STZ_TO_USDT).toFixed(3);
            }
        });

        // হিস্ট্রি লোড
        const historyRef = db.ref('withdraw_requests/' + userId);
        historyRef.on('value', snap => {
            const container = document.getElementById('withdrawHistoryContainer');
            const data = snap.val();

            if (!data) {
                container.innerHTML = `<div class="empty-history">No withdrawal requests found.</div>`;
                return;
            }

            let html = '';
            const list = Object.keys(data).map(k => data[k]).reverse();

            list.forEach(req => {
                const dateStr = new Date(req.timestamp).toLocaleDateString();
                const isPaid = req.status === "Approved" || req.status === "Paid";
                html += `
                    <div class="history-item">
                        <div>
                            <div class="net-tag">${req.network}</div>
                            <div class="time-sub">${dateStr}</div>
                        </div>
                        <div class="amt-col">
                            <div class="amt-val">-$${req.finalUsdt.toFixed(3)} USDT</div>
                            <span class="status-badge ${isPaid ? 'paid' : ''}">${req.status}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        });

        function updatePlaceholder() {
            const net = document.getElementById('withdrawNetwork').value;
            const input = document.getElementById('withdrawAddress');
            const label = document.getElementById('addrLabel');

            if (net === "Ton Address") {
                label.innerText = "Ton Wallet Address";
                input.placeholder = "Your ton address";
            } else {
                label.innerText = "Binance Pay ID";
                input.placeholder = "Your pay id";
            }
            calculatePreview();
        }

        function calculatePreview() {
            const net = document.getElementById('withdrawNetwork').value;
            const amt = parseFloat(document.getElementById('withdrawAmount').value) || 0;
            const rawUsdt = amt * STZ_TO_USDT;

            let fee = 0;
            if (net === "Ton Address") {
                fee = TON_FEE_USDT;
                document.getElementById('feeNotice').innerText = `Fee: $${fee} USDT`;
            } else {
                fee = 0;
                document.getElementById('feeNotice').innerText = `Fee: $0.00 (Free)`;
            }

            const finalUsdt = Math.max(0, rawUsdt - fee);
            document.getElementById('receiveNotice').innerText = `Receive: $${finalUsdt.toFixed(3)} USDT`;
        }

        function setMaxAmount() {
            document.getElementById('withdrawAmount').value = Math.floor(userBalance);
            calculatePreview();
        }

        function processWithdrawal() {
            const network = document.getElementById('withdrawNetwork').value;
            const address = document.getElementById('withdrawAddress').value.trim();
            const amount = parseFloat(document.getElementById('withdrawAmount').value);

            if (!address) {
                tg.showAlert(network === "Ton Address" ? "অনুগ্রহ করে Your ton address দিন!" : "অনুগ্রহ করে Your pay id দিন!");
                return;
            }

            if (isNaN(amount) || amount < MIN_WITHDRAW_STZ) {
                tg.showAlert(`ন্যূনতম উইথড্রয়াল ${MIN_WITHDRAW_STZ} STZ ($0.10 USDT)!`);
                return;
            }

            if (amount > userBalance) {
                tg.showAlert("আপনার একাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            const rawUsdt = amount * STZ_TO_USDT;
            const fee = (network === "Ton Address") ? TON_FEE_USDT : 0;
            const finalUsdt = rawUsdt - fee;
            const updatedBalance = userBalance - amount;

            const requestKey = historyRef.push().key;
            const requestPayload = {
                id: requestKey,
                userId: userId,
                network: network,
                address: address,
                amountStz: amount,
                feeUsdt: fee,
                finalUsdt: finalUsdt,
                status: "Pending",
                timestamp: Date.now()
            };

            const updates = {};
            updates['/withdraw_requests/' + userId + '/' + requestKey] = requestPayload;
            updates['/admin_withdraw_queue/' + requestKey] = requestPayload;
            updates['/stz_miners/' + userId + '/balance'] = updatedBalance;

            db.ref().update(updates).then(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Request';
                document.getElementById('withdrawAddress').value = "";
                document.getElementById('withdrawAmount').value = "";
                calculatePreview();

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert(`✅ উইথড্রয়াল সফলভাবে জমা হয়েছে!\nনেটওয়ার্ক: ${network}\nফি: $${fee} USDT\nপ্রাপ্য: $${finalUsdt.toFixed(3)} USDT`);
            }).catch(err => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Request';
                tg.showAlert("ত্রুটি ঘটেছে: " + err.message);
            });
        }
    </script>
</body>
</html>
