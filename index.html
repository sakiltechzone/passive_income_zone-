<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STZ Network - Home</title>

    <!-- Telegram & Adsgram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #1c64f2;
            --light-blue: #3f83f8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --card-glass: rgba(255, 255, 255, 0.94);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #3b82f6;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.25) 0%, transparent 60%),
                radial-gradient(rgba(255, 255, 255, 0.18) 1.5px, transparent 1.5px),
                linear-gradient(180deg, #1d6bf3 0%, #60a5fa 35%, #bfdbfe 70%, #f0f6ff 100%);
            background-size: 100% 100%, 16px 16px, 100% 100%;
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 16px 18px 95px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header */
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .brand-badge { display: flex; align-items: center; gap: 8px; }
        .logo-box {
            width: 32px; height: 32px; background: #0f4bd8;
            border-radius: 9px; color: #fff; display: flex;
            align-items: center; justify-content: center; font-size: 14px;
        }
        .brand-text { font-size: 19px; font-weight: 700; color: #ffffff; }

        /* Profile Icon Button */
        .profile-link-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.28);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 12px rgba(15, 75, 216, 0.15);
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .profile-link-btn:active {
            transform: scale(0.92);
        }

        /* Total Balance */
        .total-box { text-align: center; margin: 4px 0 16px 0; color: #fff; }
        .total-box .sub { font-size: 13px; font-weight: 500; opacity: 0.9; }
        .total-box .val { font-size: 38px; font-weight: 800; letter-spacing: -0.5px; }
        .total-box .usdt { font-size: 12px; font-weight: 700; color: #022b7a; margin-top: 2px; }

        /* Circular AI Orb Stage */
        .orb-stage-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin: 6px 0 16px 0;
        }

        .rate-badge {
            background: var(--card-glass);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            padding: 12px 10px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 86px;
            height: 78px;
            box-shadow: 0 8px 20px rgba(15, 75, 216, 0.12);
            flex-shrink: 0;
        }
        .rate-badge .val { font-size: 15px; font-weight: 800; color: #0f172a; }
        .rate-badge .lbl { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
        .rate-badge .chart-wave {
            width: 40px; height: 10px; margin-top: 4px;
            border-bottom: 2px solid #3b82f6; border-radius: 50%;
        }

        .orb-center-anchor {
            width: 140px;
            height: 140px;
            aspect-ratio: 1 / 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .orb-outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-bottom: 3.5px solid var(--primary-blue);
            transform: rotate(-35deg);
            pointer-events: none;
        }

        .orb-core-sphere {
            width: 122px;
            height: 122px;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, #8ec5fc 35%, #2575fc 75%, #0d47a1 100%);
            box-shadow: 
                0 15px 35px rgba(28, 100, 242, 0.4),
                inset -6px -6px 18px rgba(10, 37, 100, 0.7),
                inset 6px 6px 14px rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: orbFloat 4s ease-in-out infinite;
        }

        .orb-eyes-row {
            display: flex;
            gap: 22px;
            align-items: center;
        }
        .orb-eye {
            width: 6px;
            height: 15px;
            background: #ffffff;
            border-radius: 4px;
            box-shadow: 0 0 10px #ffffff, 0 0 4px #ffffff;
        }

        /* Session Remaining Pill */
        .session-timer-pill {
            background: var(--card-glass);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 9px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 22px;
            box-shadow: 0 8px 20px rgba(15, 75, 216, 0.08);
        }
        .session-timer-pill .t-num { font-size: 18px; font-weight: 800; color: #0f172a; letter-spacing: 0.5px; }
        .session-timer-pill .t-lbl { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 1px; }

        /* Accelerate Grid */
        .accel-box { width: 100%; }
        .accel-box h3 { font-size: 16px; font-weight: 800; color: #0f172a; }
        .accel-box p { font-size: 12px; color: var(--text-muted); margin: 3px 0 12px 0; }

        .accel-grid { display: flex; gap: 10px; width: 100%; }
        .accel-card {
            flex: 1; background: #ffffff; border-radius: 20px;
            padding: 14px 10px; display: flex; flex-direction: column;
            align-items: center; position: relative; box-shadow: 0 6px 18px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02); cursor: pointer;
        }
        .accel-card.disabled { opacity: 0.55; cursor: not-allowed; }
        .accel-card .status-dot {
            position: absolute; top: 10px; right: 10px; width: 18px; height: 18px;
            border-radius: 50%; background: #e2edff; color: var(--primary-blue);
            font-size: 9px; display: flex; align-items: center; justify-content: center;
        }
        .accel-card.active-boost .status-dot { background: #10b981; color: #fff; }
        .accel-bolt { font-size: 26px; color: #3b82f6; margin: 8px 0; }
        .accel-pct { font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
        .accel-btn {
            width: 100%; padding: 6px 0; border-radius: 14px;
            background: #ecf3ff; border: none; color: var(--primary-blue);
            font-size: 11px; font-weight: 700; cursor: pointer;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
            background: #ffffff; display: flex; justify-content: space-around;
            align-items: center; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            color: #94a3b8; font-size: 11px; font-weight: 700;
            cursor: pointer;
        }
        .nav-item.active { color: var(--primary-blue); }
        .nav-item i { font-size: 18px; }

        .center-mine-btn {
            width: 50px; height: 50px; border-radius: 50%;
            background: linear-gradient(135deg, #3b76f6, #1856f3);
            color: #fff; display: flex; align-items: center; justify-content: center;
            margin-top: -24px; box-shadow: 0 6px 18px rgba(24, 86, 243, 0.4);
            font-size: 18px;
            cursor: pointer;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Header -->
        <div class="top-nav">
            <div class="brand-badge">
                <div class="logo-box"><i class="fas fa-layer-group"></i></div>
                <span class="brand-text">Home</span>
            </div>
            
            <div onclick="goToPage('profile.html')" class="profile-link-btn" id="topProfileBtn" title="Profile">
                <i class="fas fa-user"></i>
            </div>
        </div>

        <!-- Total Assets -->
        <div class="total-box">
            <span class="sub">Total STZ</span>
            <div class="val" id="totalStzDisplay">0.00</div>
            <div class="usdt">≈ $<span id="totalUsdtDisplay">0.000</span> USDT</div>
        </div>

        <!-- Circular AI Orb Stage -->
        <div class="orb-stage-wrapper">
            <div class="rate-badge">
                <span class="val" id="currentRateDisplay">0.417</span>
                <span class="lbl">STZ/hour</span>
                <div class="chart-wave"></div>
            </div>

            <div class="orb-center-anchor">
                <div class="orb-outer-ring"></div>
                <div class="orb-core-sphere">
                    <div class="orb-eyes-row">
                        <span class="orb-eye"></span>
                        <span class="orb-eye"></span>
                    </div>
                </div>
            </div>

            <div class="rate-badge">
                <span class="val" style="color: var(--primary-blue);" id="ratePercentDisplay">+0%</span>
                <span class="lbl">Hourly rate</span>
            </div>
        </div>

        <!-- Session Remaining (12h) -->
        <div class="session-timer-pill">
            <span class="t-num" id="sessionTimerText">12:00:00</span>
            <span class="t-lbl">Session remained</span>
        </div>

        <!-- Accelerate Grid -->
        <div class="accel-box">
            <h3>AI accelerate</h3>
            <p>Activate mining to accelerate</p>

            <div class="accel-grid">
                <!-- Boost 1: +30% -->
                <div class="accel-card" id="card-boost-1" onclick="handleAdClick(1, 30)">
                    <span class="status-dot" id="dot-boost-1"><i class="fas fa-play"></i></span>
                    <i class="fas fa-bolt accel-bolt"></i>
                    <span class="accel-pct">+30%</span>
                    <button class="accel-btn" id="btn-boost-1">Accelerate</button>
                </div>

                <!-- Boost 2: +60% -->
                <div class="accel-card disabled" id="card-boost-2" onclick="handleAdClick(2, 60)">
                    <span class="status-dot" id="dot-boost-2"><i class="fas fa-lock"></i></span>
                    <i class="fas fa-bolt accel-bolt"></i>
                    <span class="accel-pct">+60%</span>
                    <button class="accel-btn" id="btn-boost-2">Accelerate</button>
                </div>

                <!-- Boost 3: +100% -->
                <div class="accel-card disabled" id="card-boost-3" onclick="handleAdClick(3, 100)">
                    <span class="status-dot" id="dot-boost-3"><i class="fas fa-lock"></i></span>
                    <i class="fas fa-bolt accel-bolt"></i>
                    <span class="accel-pct">+100%</span>
                    <button class="accel-btn" id="btn-boost-3">Accelerate</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <div onclick="goToPage('index.html')" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div onclick="goToPage('dashboard.html')" class="center-mine-btn">
            <i class="fas fa-hammer"></i>
        </div>
        <div onclick="goToPage('refer.html')" class="nav-item">
            <i class="fas fa-user-friends"></i>
            <span>Referral</span>
        </div>
    </nav>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function goToPage(target) {
            const base = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            window.location.href = base + target;
        }

        const ADSGRAM_BLOCK_ID = "26734";
        const STZ_TO_USDT = 0.001; // ১ STZ = $০.০০১ USDT
        const CYCLE_MS = 12 * 60 * 60 * 1000; // ১২ ঘণ্টা সাইকেল
        const BASE_HOURLY = 5 / 12; // ১২ ঘণ্টায় ৫ STZ (দিনে ১০ STZ = $০.০১)

        const firebaseConfig = {
            apiKey: "AIzaSyAl0eRqOs5QNUg_J1Pj-4PlEqRDxAXr-oA",
            authDomain: "viral-zone-bd.firebaseapp.com",
            projectId: "viral-zone-bd",
            storageBucket: "viral-zone-bd.firebasestorage.app",
            messagingSenderId: "794737483555",
            appId: "1:794737483555:web:a275cd96aafff0e640f696",
            databaseURL: "https://viral-zone-bd-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userId = "sakil24";
        let userData = { balance: 0, miningStartedAt: 0, boostLevel: 0 };
        let adsController = null;

        function initAdsgram() {
            try {
                if (window.Adsgram) {
                    adsController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
                }
            } catch(e) {
                console.error("Adsgram init failed:", e);
            }
        }
        initAdsgram();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            userId = u.id ? u.id.toString() : (u.username || "sakil24");
            if (u.first_name) {
                document.getElementById('topProfileBtn').innerText = u.first_name[0].toUpperCase();
            }
        }

        const userRef = db.ref('stz_miners/' + userId);
        userRef.on('value', snap => {
            const val = snap.val();
            if (val) {
                userData = Object.assign(userData, val);
            } else {
                userRef.set(userData);
            }
            updateUI();
        });

        // লাইভ টাইমার ও ব্যালেন্স লুপ
        setInterval(() => {
            const now = Date.now();
            const elapsed = now - (userData.miningStartedAt || 0);
            const isMining = (userData.miningStartedAt > 0) && (elapsed < CYCLE_MS);

            let mult = 1.0;
            let boostPct = 0;
            if (userData.boostLevel === 1) { mult = 1.30; boostPct = 30; }
            else if (userData.boostLevel === 2) { mult = 1.60; boostPct = 60; }
            else if (userData.boostLevel === 3) { mult = 2.00; boostPct = 100; }

            document.getElementById('ratePercentDisplay').innerText = `+${boostPct}%`;
            document.getElementById('currentRateDisplay').innerText = (BASE_HOURLY * mult).toFixed(3);

            if (isMining) {
                const rem = CYCLE_MS - elapsed;
                renderTimer(rem);
                const minedNow = (elapsed / 1000) * ((BASE_HOURLY * mult) / 3600);
                const currentTotal = (userData.balance || 0) + minedNow;
                document.getElementById('totalStzDisplay').innerText = currentTotal.toFixed(2);
                document.getElementById('totalUsdtDisplay').innerText = (currentTotal * STZ_TO_USDT).toFixed(3);
            } else {
                renderTimer(0);
                document.getElementById('totalStzDisplay').innerText = (userData.balance || 0).toFixed(2);
                document.getElementById('totalUsdtDisplay').innerText = ((userData.balance || 0) * STZ_TO_USDT).toFixed(3);
            }
        }, 1000);

        function renderTimer(ms) {
            const s = Math.max(0, Math.floor(ms / 1000));
            const hrs = String(Math.floor(s / 3600)).padStart(2, '0');
            const mins = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
            const secs = String(s % 60).padStart(2, '0');
            document.getElementById('sessionTimerText').innerText = `${hrs}:${mins}:${secs}`;
        }

        function updateUI() {
            const lvl = userData.boostLevel || 0;
            for (let i = 1; i <= 3; i++) {
                const card = document.getElementById(`card-boost-${i}`);
                const dot = document.getElementById(`dot-boost-${i}`);
                const btn = document.getElementById(`btn-boost-${i}`);

                if (i <= lvl) {
                    card.className = "accel-card active-boost";
                    dot.innerHTML = '<i class="fas fa-check"></i>';
                    btn.innerText = "Accelerated";
                } else if (i === lvl + 1) {
                    card.className = "accel-card";
                    dot.innerHTML = '<i class="fas fa-play"></i>';
                    btn.innerText = "Accelerate";
                } else {
                    card.className = "accel-card disabled";
                    dot.innerHTML = '<i class="fas fa-lock"></i>';
                    btn.innerText = "Accelerate";
                }
            }
        }

        function handleAdClick(step, pct) {
            if (step !== ((userData.boostLevel || 0) + 1)) {
                if (step <= (userData.boostLevel || 0)) tg.showAlert("এই বুস্টটি ইতিমধ্যে সক্রিয় আছে।");
                else tg.showAlert("ধারাবাহিকভাবে আগের বুস্টটি সম্পন্ন করুন।");
                return;
            }

            if (!adsController) {
                initAdsgram();
            }

            if (adsController) {
                adsController.show().then(() => {
                    activateBoost(step);
                }).catch((err) => {
                    console.log("Ad error:", err);
                    tg.showConfirm("বিজ্ঞাপনটি লোড হতে সমস্যা হয়েছে। আপনি কি বুস্ট সক্রিয় করতে চান?", (ok) => {
                        if (ok) activateBoost(step);
                    });
                });
            } else {
                activateBoost(step);
            }
        }

        function activateBoost(step) {
            userData.boostLevel = step;
            userRef.update({ boostLevel: userData.boostLevel });
            updateUI();
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert(`🚀 মাইনিং স্পিড বৃদ্ধি পেয়েছে!`);
        }
    </script>
</body>
</html>
